<!DOCTYPE html>
<html>
	<head>
	<meta charset="UTF-8" />
	<style>
		#maze {
			border-style: solid;
		}

		.block {
			float: left;
			height: 20px;
			width: 20px;
		}

		.wall {
			background-color: #000;
		}

		.me {
			position: relative;
			background-color: #23afee;/****************/
		}

		.me:after {
			/* background-color: #23afee;
			border-radius: 100%;
			content: '';
			height: 20px;
			position: absolute;
			top: 0;
			width: 20px; */
		}

		.finish {
			background-color: #f31d1d;
		}

		#complete {
			display: none;
			/* height: 360px;
			left: 20%;
			position: absolute;
			right: 20%;
			top: 50px;
			width: 640px;
			z-index: 1000; */
		}

		#complete img {
			/* height: 100%;
			width: 100%; */
		}
	</style>

	</head>

	<body>
		<div id='maze'></div>
		<div id='complete'>MISSION ACCOMPLISHED</div>

		<script>
			let size = 20,
					// heightMaze = 50,
					// widthMaze = 110;
					heightMaze = 20,
					widthMaze = 50;

			function doMaze(height, width, maze, walls, currentPosition) {
				height = height % 2 === 0 ? height + 1 : height;
				width = width % 2 === 0 ? width + 1 : width;
				document.getElementById('maze').setAttribute('style', 'height:' + height * size + 'px; width:' + width * size + 'px');

				for (let y = 0; y < height; y++) {
					maze[y] = [];

					for (let x = 0; x < width; x++) {
						maze[y][x] = 'wall';
						let el = document.getElementById('maze').appendChild(document.createElement("div"));
						el.className = 'block wall';
						el.setAttribute('id', y + '-' + x);
					}
				}

				function amaze(y, x, addBlockWalls) {
					maze[y][x] = 'maze';
					document.getElementById(y + '-' + x).className = 'block';

					if (addBlockWalls && valid(y + 1, x) && (maze[y + 1][x] === 'wall')) walls.push([y + 1, x, [y, x]]);
					if (addBlockWalls && valid(y - 1, x) && (maze[y - 1][x] === 'wall')) walls.push([y - 1, x, [y, x]]);
					if (addBlockWalls && valid(y, x + 1) && (maze[y][x + 1] === 'wall')) walls.push([y, x + 1, [y, x]]);
					if (addBlockWalls && valid(y, x - 1) && (maze[y][x - 1] === 'wall')) walls.push([y, x - 1, [y, x]]);
				}

				function valid(a, b) {
					return (a < height && a >= 0 && b < width && b >= 0) ? true : false;
				};

				amaze(currentPosition[0], currentPosition[1], true);
				
				while (walls.length !== 0) {
					let randomWall = walls[Math.floor(Math.random() * walls.length)],
							host = randomWall[2],
							// opposite = [(host[0] + (randomWall[0] - host[0]) * 2), (host[1] + (randomWall[1] - host[1]) * 2)];
							opposite = [(host[0] + (randomWall[0] - host[0]) * 2), (host[1] + (randomWall[1] - host[1]) * 2)];

					// if (valid(opposite[0], opposite[1])) {
						if (maze[opposite[0]][opposite[1]] === 'maze') {
							walls.splice(walls.indexOf(randomWall), 1);
						}	else {
							amaze(randomWall[0], randomWall[1], false);
							amaze(opposite[0], opposite[1], true);
							console.log(opposite);
							console.log(randomWall);
						}
					// } else {
					// 	walls.splice(walls.indexOf(randomWall), 1);
					// }
				}
				
				document.getElementById('0-0').className = 'block me';
				document.getElementById((height - 1) + '-' + (width - 1)).className = 'block finish';
				
				document.body.onkeydown = function(e) {
					let newPosition = [currentPosition[0] + ((e.keyCode - 39) % 2), currentPosition[1] + ((e.keyCode - 38) % 2)];

					if (valid(newPosition[0], newPosition[1]) && maze[newPosition[0]][newPosition[1]] !== 'wall') {
						document.getElementById(currentPosition[0] + '-' + currentPosition[1]).className = 'block';
						currentPosition = newPosition;
						document.getElementById(currentPosition[0] + '-' + currentPosition[1]).className = 'block me';

						if (currentPosition[0] === height - 1 && currentPosition[1] === width - 1) {
							document.getElementById('complete').setAttribute('style', 'display:block');
						}
					}
				}

				document.body.onclick = function(e) {
					let newPosition = [+e.target.id.split('-')[0], +e.target.id.split('-')[1]];

					if (valid(newPosition[0], newPosition[1]) && maze[newPosition[0]][newPosition[1]] !== 'wall') {
						document.getElementById(currentPosition[0] + '-' + currentPosition[1]).className = 'block';
						currentPosition = newPosition;
						document.getElementById(currentPosition[0] + '-' + currentPosition[1]).className = 'block me';

						if (currentPosition[0] === height - 1 && currentPosition[1] === width - 1) {
							document.getElementById('complete').setAttribute('style', 'display:block');
						}
					}
				}
			}
			
			doMaze(heightMaze, widthMaze, [], [], [0, 0]);
		</script>
	</body>
</html>
